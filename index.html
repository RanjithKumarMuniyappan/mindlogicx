<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mindlogicx — a global knowledge engineering company building AI-first platforms across EdTech, FinTech, HealthTech and LegalTech."
    />

    <!--
      Roboto carries the whole pattern: the display scale, the body copy and
      (as Roboto Mono) the numbered section indices. The reference design is
      set in Circular Pro, which is a commercial licence; Roboto was chosen as
      the substitute. Weights are deliberately narrow — the pattern sets its
      oversized headings at 400, not bold, and 500 is only used for pills,
      nav links and eyebrows.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      No vendor stylesheets. The previous build linked Bootstrap, animate.css,
      FontAwesome, an icon font and a display font from /public; this pattern is
      flat and typography-led and needs none of them. Layout is CSS grid,
      entrance animations are in ls.css, and every glyph is an inline SVG in
      src/components/common/icons.jsx.
    -->

    <title>Mindlogicx — Global Knowledge Engineering Company</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
